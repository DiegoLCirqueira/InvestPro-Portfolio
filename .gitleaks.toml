# Configuração do Gitleaks (job "secret-scan" do CI).
# Mantém TODAS as regras padrão ligadas e libera apenas o valor exato abaixo.
title = "InvestPro"

[extend]
useDefault = true

[allowlist]
description = "Senha de fixture usada só em testes automatizados (valor fictício, nunca usado fora dos testes)"
# Casa com o valor (secret) encontrado, não com o nome do arquivo: um segredo real colado num teste continua sendo detectado.
regexes = ['''^SenhaForte123$''']

# Fixtures fictícias dos testes de autenticação, apontadas pelo gitleaks na varredura do histórico completo.
# Cada exceção vale só para o valor exato E só dentro do arquivo indicado (condition = AND): o mesmo valor
# em outro arquivo, ou qualquer outro segredo neste arquivo, continua sendo detectado.
# Ficam na regra generic-api-key (a que gerou os achados): o gitleaks 8.24 do CI não aplica
# exceções globais [[allowlists]], só as da própria regra. A regra padrão continua igual.

[[rules]]
id = "generic-api-key"

# Valor fictício de teste (não é credencial real), liberado só neste arquivo.
[[rules.allowlists]]
description = "Valor fictício de teste em auth.routes.test.ts (fluxo feliz: redefine a senha e invalida refresh tokens antigos); nunca usado fora dos testes"
condition = "AND"
paths = ['''^packages/server/src/modules/auth/__tests__/auth\.routes\.test\.ts$''']
regexes = ['''^NovaSenhaForte456$''']

# Valor fictício de teste (não é credencial real), liberado só neste arquivo.
[[rules.allowlists]]
description = "Valor fictício de teste em auth.routes.test.ts (token expirado retorna 400 INVALID_RESET_TOKEN (mensagem genérica)); nunca usado fora dos testes"
condition = "AND"
paths = ['''^packages/server/src/modules/auth/__tests__/auth\.routes\.test\.ts$''']
regexes = ['''^OutraSenha789$''']

# Valor fictício de teste (não é credencial real), liberado só neste arquivo.
[[rules.allowlists]]
description = "Valor fictício de teste em auth.routes.test.ts (token reutilizado (já usado) retorna 400 INVALID_RESET_TOKEN); nunca usado fora dos testes"
condition = "AND"
paths = ['''^packages/server/src/modules/auth/__tests__/auth\.routes\.test\.ts$''']
regexes = ['''^SegundaTroca456$''']

# Valor fictício de teste (não é credencial real), liberado só neste arquivo.
[[rules.allowlists]]
description = "Valor fictício de teste em auth.routes.test.ts (token inexistente retorna 400 INVALID_RESET_TOKEN (mesma mensagem genérica)); nunca usado fora dos testes"
condition = "AND"
paths = ['''^packages/server/src/modules/auth/__tests__/auth\.routes\.test\.ts$''']
regexes = ['''^QualquerSenha123$''']

# Valor fictício de teste (não é credencial real), liberado só neste arquivo.
[[rules.allowlists]]
description = "Valor fictício de teste em auth.service.test.ts (redefine a senha, invalida refresh tokens e outros tokens de reset pendentes (fluxo feliz); lança INVALID_RESET_TOKEN (genérico) quando o token não existe/expirou/já foi usado); nunca usado fora dos testes"
condition = "AND"
paths = ['''^packages/server/src/modules/auth/__tests__/auth\.service\.test\.ts$''']
regexes = ['''^NovaSenhaForte123$''']
