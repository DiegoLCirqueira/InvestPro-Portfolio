services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco SÓ dos testes de integração (npm run test:db:up no packages/server).
  # Porta própria (5433) pra não misturar com o de desenvolvimento, e dados em
  # memória: descartável, rápido, sempre começa limpo. Os testes nunca devem
  # apontar para o banco de produção (ver src/test/assert-test-database.ts).
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investpro_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    # Sem durabilidade: o banco é descartável e fica bem mais rápido.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investpro_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
